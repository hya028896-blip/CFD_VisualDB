[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-visualdb"
version = "0.1.0"
description = "CFD simulation data management and multi-view visualization prototype"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.7",
  "pyvista>=0.46",
  "pyvistaqt>=0.11",
  "vtk>=9.3",
]

[project.scripts]
cfd-visualdb = "cfd_visualdb.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

